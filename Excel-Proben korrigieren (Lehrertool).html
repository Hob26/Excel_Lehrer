<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Excel-Proben korrigieren – Lehrertool</title>
<style>

</style></head><body>
<header><div><h1>✅ Excel-Proben korrigieren</h1><p>Lehrertool für die Übungsprobe „Wintersporttag“ und die Kurzprobe „Pausenverkauf“ – Abgabe-Dateien hineinziehen, die Korrektur passiert automatisch.</p></div></header>
<div id="key"></div><main id="main"></main><div id="toast"></div>
<script>
'use strict';
/* =====================================================================
   HILFSFUNKTIONEN
   ===================================================================== */
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function colName(c){let s='';c++;while(c>0){const m=(c-1)%26;s=String.fromCharCode(65+m)+s;c=Math.floor((c-1)/26);}return s;}
function colIndex(s){let n=0;for(const ch of s.toUpperCase())n=n*26+(ch.charCodeAt(0)-64);return n-1;}
const A=(c,r)=>colName(c)+(r+1);
function parseA(a){const m=/^\$?([A-Z]{1,3})\$?(\d+)$/i.exec(String(a).trim());return m?{c:colIndex(m[1]),r:+m[2]-1}:null;}
const store={get(k,d){try{const v=localStorage.getItem('xltr9_'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('xltr9_'+k,JSON.stringify(v));}catch(e){}},del(k){try{localStorage.removeItem('xltr9_'+k);}catch(e){}}};
const clone=o=>o==null?o:JSON.parse(JSON.stringify(o,(k,v)=>k==='_ast'?undefined:v));

/* ---------- Datum ---------- */
const DAY=86400000,EPOCH=Date.UTC(1899,11,30);
const serial=(y,m,d)=>Math.round((Date.UTC(y,m-1,d)-EPOCH)/DAY);
function fromSerial(s){const d=new Date(EPOCH+Math.floor(s)*DAY);return{y:d.getUTCFullYear(),m:d.getUTCMonth()+1,d:d.getUTCDate(),wd:d.getUTCDay()};}
function todaySerial(){const n=new Date();return serial(n.getFullYear(),n.getMonth()+1,n.getDate());}
const WD=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const MO=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const LISTS=[['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'],['Mo','Di','Mi','Do','Fr','Sa','So'],MO,['Jan','Feb','Mrz','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez']];

/* ---------- Fehlerwerte ---------- */
class XErr{constructor(e){this.e=e;}}
const isErr=v=>v instanceof XErr;
const E={NAME:new XErr('#NAME?'),VALUE:new XErr('#WERT!'),DIV0:new XErr('#DIV/0!'),REF:new XErr('#BEZUG!'),NUM:new XErr('#ZAHL!')};
class FErr extends Error{constructor(m,code){super(m);this.code=code;}}

/* ---------- Anzeige-Formate ---------- */
const pad=n=>String(n).padStart(2,'0');
function fmtGeneral(n){if(!isFinite(n))return '#ZAHL!';if(Number.isInteger(n)&&Math.abs(n)<1e11)return String(n);let s=+n.toPrecision(10);let t=String(s);if(/e/.test(t))t=s.toExponential(4).replace('e+','E+');return t.replace('.',',');}
const fmtFixed=(n,d)=>n.toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtDate=s=>{const d=fromSerial(s);return pad(d.d)+'.'+pad(d.m)+'.'+d.y;};
function fmtTime(x,sec){let f=x-Math.floor(x);let t=Math.round(f*86400);if(t>=86400)t=0;const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return pad(h)+':'+pad(m)+(sec?':'+pad(s):'');}
function fmtVal(v,fmt){
  if(v==null)return '';
  if(isErr(v))return v.e;
  if(typeof v==='boolean')return v?'WAHR':'FALSCH';
  if(typeof v==='string')return v;
  switch(fmt){
    case 'date':return v<0?'########':fmtDate(v);
    case 'datelong':{if(v<0)return '########';const d=fromSerial(v);return WD[d.wd]+', '+d.d+'. '+MO[d.m-1]+' '+d.y;}
    case 'time':return fmtTime(v);
    case 'datetime':return fmtDate(v)+' '+fmtTime(v);
    case 'currency':return fmtFixed(v,2)+' €';
    case 'number':return fmtFixed(v,2);
    case 'percent':return fmtGeneral(Math.round(v*10000)/100)+'%';
    default:return fmtGeneral(v);
  }
}

/* ---------- Eingabe deuten ---------- */
function parseLiteral(t){
  if(t.startsWith("'"))return{v:t.slice(1)};
  const s=t.trim();let m;
  if(s==='')return{v:null};
  if(/^[-+]?\d+(,\d+)?$/.test(s))return{v:parseFloat(s.replace(',','.'))};
  if(/^[-+]?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s))return{v:parseFloat(s.replace(/\./g,'').replace(',','.'))};
  if(m=/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})?$/.exec(s)||/^(\d{1,2})\.(\d{1,2})$/.exec(s)){
    const d=+m[1],mo=+m[2];let y=m[3]?+m[3]:new Date().getFullYear();if(y<100)y+=y<30?2000:1900;
    if(mo>=1&&mo<=12&&d>=1&&d<=31){const sr=serial(y,mo,d);const b=fromSerial(sr);if(b.d===d)return{v:sr,fmt:'date'};}
    if(/^\d+\.\d+$/.test(s))return{v:parseFloat(s)};
  }
  if(/^[-+]?\d+\.\d+$/.test(s))return{v:parseFloat(s)};
  if(m=/^(\d{1,2}):(\d{2})(:(\d{2}))?$/.exec(s)){const h=+m[1],mi=+m[2],se=m[4]?+m[4]:0;if(mi<60&&se<60)return{v:(h*3600+mi*60+se)/86400,fmt:'time'};}
  if(m=/^([-+]?[\d.]*\d(,\d+)?)\s*€$/.exec(s)){const n=parseFloat(m[1].replace(/\./g,'').replace(',','.'));if(!isNaN(n))return{v:n,fmt:'currency'};}
  if(m=/^([-+]?\d+(,\d+)?)\s*%$/.exec(s))return{v:parseFloat(m[1].replace(',','.'))/100,fmt:'percent'};
  if(/^wahr$/i.test(s))return{v:true};if(/^falsch$/i.test(s))return{v:false};
  return{v:t};
}

/* =====================================================================
   FORMEL-ENGINE
   ===================================================================== */
function tokenize(src){
  const T=[];let i=0;const n=src.length;
  while(i<n){
    const ch=src[i];
    if(ch===' '){i++;continue;}
    if(ch==='"'){let j=i+1,s='';while(j<n){if(src[j]==='"'){if(src[j+1]==='"'){s+='"';j+=2;continue;}break;}s+=src[j];j++;}
      if(j>=n)throw new FErr('Ein Anführungszeichen fehlt.','quote');T.push({t:'str',v:s});i=j+1;continue;}
    const rest=src.slice(i);let m;
    if(rest.startsWith('#BEZUG!')){T.push({t:'err'});i+=7;continue;}
    if(m=/^\d+([.,]\d+)?/.exec(rest)){
      if(/^\d+[.,]\d+/.test(rest)||!/^\d+[A-Za-zÄÖÜäöü]/.test(rest)){T.push({t:'num',v:parseFloat(m[0].replace(',','.'))});i+=m[0].length;continue;}
    }
    if(m=/^(\$?)([A-Za-z]{1,3})(\$?)(\d+)(?![A-Za-z0-9_(ÄÖÜäöüß])/.exec(rest)){T.push({t:'ref',c:colIndex(m[2]),r:+m[4]-1,ac:!!m[1],ar:!!m[3]});i+=m[0].length;continue;}
    if(m=/^[A-Za-zÄÖÜäöüß_][A-Za-zÄÖÜäöüß0-9_.]*/.exec(rest)){T.push({t:'id',v:m[0].toUpperCase()});i+=m[0].length;continue;}
    if(m=/^(<=|>=|<>)/.exec(rest)){T.push({t:'op',v:m[0]});i+=2;continue;}
    if('+-*/^&=<>%'.includes(ch)){T.push({t:'op',v:ch});i++;continue;}
    if('();:'.includes(ch)){T.push({t:ch});i++;continue;}
    if(ch===',')throw new FErr('Komma statt Semikolon','comma');
    throw new FErr('Das Zeichen „'+ch+'“ versteht Excel hier nicht.','char');
  }
  return T;
}
function parseFormula(src){
  const T=tokenize(src);let p=0;
  const next=()=>T[p++];const isOp=v=>T[p]&&T[p].t==='op'&&T[p].v===v;
  const CMP=['=','<>','<','>','<=','>='];
  function expr(){let a=concat();while(T[p]&&T[p].t==='op'&&CMP.includes(T[p].v)){const op=next().v;a={k:'bin',op,a,b:concat()};}return a;}
  function concat(){let a=add();while(isOp('&')){next();a={k:'bin',op:'&',a,b:add()};}return a;}
  function add(){let a=mul();while(isOp('+')||isOp('-')){const op=next().v;a={k:'bin',op,a,b:mul()};}return a;}
  function mul(){let a=pw();while(isOp('*')||isOp('/')){const op=next().v;a={k:'bin',op,a,b:pw()};}return a;}
  function pw(){let a=un();while(isOp('^')){next();a={k:'bin',op:'^',a,b:un()};}return a;}
  function un(){if(isOp('-')){next();return{k:'neg',a:un()};}if(isOp('+')){next();return un();}return post();}
  function post(){let a=prim();while(isOp('%')){next();a={k:'pct',a};}return a;}
  function prim(){
    const t=next();if(!t)throw new FErr('Die Formel ist unvollständig.','incomplete');
    if(t.t==='num')return{k:'num',v:t.v};
    if(t.t==='str')return{k:'str',v:t.v};
    if(t.t==='err')return{k:'errv'};
    if(t.t==='ref'){if(T[p]&&T[p].t===':'){next();const u=next();if(!u||u.t!=='ref')throw new FErr('Der Zellbereich ist unvollständig.','range');return{k:'range',a:t,b:u};}return{k:'ref',c:t.c,r:t.r};}
    if(t.t==='id'){
      if(T[p]&&T[p].t==='('){next();const args=[];
        if(T[p]&&T[p].t===')'){next();return{k:'fn',name:t.v,args};}
        while(true){if(T[p]&&(T[p].t===';'||T[p].t===')'))args.push({k:'missing'});else args.push(expr());
          const s=next();if(!s)throw new FErr('Eine Klammer fehlt.','paren');if(s.t===')')break;if(s.t!==';')throw new FErr('Hier erwartet Excel ein Semikolon ; oder eine Klammer ).','sep');}
        return{k:'fn',name:t.v,args};}
      if(t.v==='WAHR')return{k:'bool',v:true};if(t.v==='FALSCH')return{k:'bool',v:false};
      return{k:'name',v:t.v};
    }
    if(t.t==='('){const e=expr();const c=next();if(!c||c.t!==')')throw new FErr('Eine Klammer fehlt.','paren');return e;}
    throw new FErr('An dieser Stelle steht ein unerwartetes Zeichen.','unexpected');
  }
  if(!T.length)throw new FErr('Die Formel ist leer.','empty');
  const ast=expr();if(p<T.length)throw new FErr('In der Formel stehen überzählige Zeichen.','extra');
  return ast;
}
function validateAst(n){
  if(!n||typeof n!=='object')return;
  if(n.k==='fn'&&FN[n.name]){const f=FN[n.name];const c=n.args.length;
    if(c<f.min)throw new FErr('Für die Funktion '+n.name+' hast du zu wenige Argumente eingegeben.','args');
    if(c>f.max)throw new FErr('Für die Funktion '+n.name+' hast du zu viele Argumente eingegeben.','args');}
  if(n.args)n.args.forEach(validateAst);if(n.a&&n.a.k)validateAst(n.a);if(n.b&&n.b.k)validateAst(n.b);
}
function getAst(cell){if(!cell._ast||cell._src!==cell.f){try{cell._ast=parseFormula(cell.f.slice(1));}catch(e){cell._ast={k:'errname'};}cell._src=cell.f;}return cell._ast;}
function cellValue(sh,c,r,cx){
  if(c<0||r<0)return E.REF;
  const k=A(c,r),cell=sh.cells[k];if(!cell)return null;
  if(cell.f==null)return(cell.v===''||cell.v===undefined)?null:cell.v;
  if(cx.cache.has(k))return cx.cache.get(k);
  if(cx.vis.has(k))return 0;
  cx.vis.add(k);let v;
  try{const ast=getAst(cell);v=ast.k==='errname'?E.NAME:evalAst(ast,sh,cx);}catch(e){v=E.VALUE;}
  if(v&&v.range)v=E.VALUE;if(v==null)v=0;
  cx.vis.delete(k);cx.cache.set(k,v);return v;
}
const scalar=v=>(v&&v.range)?E.VALUE:v;
function num(v){v=scalar(v);if(v==null)return 0;if(isErr(v))return v;if(typeof v==='number')return v;if(typeof v==='boolean')return v?1:0;
  const lit=parseLiteral(String(v));if(typeof lit.v==='number')return lit.v;return E.VALUE;}
function str(v){if(v==null)return '';if(typeof v==='boolean')return v?'WAHR':'FALSCH';if(typeof v==='number')return fmtGeneral(v);return String(v);}
const rank=v=>typeof v==='number'?0:typeof v==='string'?1:2;
function compare(a,b){
  if(a==null&&b==null)return 0;
  if(a==null)a=typeof b==='number'?0:typeof b==='string'?'':false;
  if(b==null)b=typeof a==='number'?0:typeof a==='string'?'':false;
  const ra=rank(a),rb=rank(b);if(ra!==rb)return ra-rb;
  if(ra===0)return Math.abs(a-b)<1e-9?0:(a<b?-1:1);
  if(ra===1){const x=a.toLowerCase(),y=b.toLowerCase();return x===y?0:(x.localeCompare(y,'de')<0?-1:1);}
  return a===b?0:(a?1:-1);
}
const cmpRes=(op,c)=>({'=':c===0,'<>':c!==0,'<':c<0,'>':c>0,'<=':c<=0,'>=':c>=0})[op];
function binop(op,a,b){
  if(isErr(a))return a;if(isErr(b))return b;
  if(op==='&')return str(a)+str(b);
  if(['=','<>','<','>','<=','>='].includes(op))return cmpRes(op,compare(a,b));
  const x=num(a),y=num(b);if(isErr(x))return x;if(isErr(y))return y;
  switch(op){case '+':return x+y;case '-':return x-y;case '*':return x*y;case '/':return y===0?E.DIV0:x/y;case '^':return Math.pow(x,y);}
}
function evalAst(n,sh,cx){
  switch(n.k){
    case 'num':case 'str':case 'bool':return n.v;
    case 'missing':return null;
    case 'errv':return E.REF;
    case 'name':return E.NAME;
    case 'ref':return cellValue(sh,n.c,n.r,cx);
    case 'range':return{range:true,a:n.a,b:n.b};
    case 'neg':{const v=num(evalAst(n.a,sh,cx));return isErr(v)?v:-v;}
    case 'pct':{const v=num(evalAst(n.a,sh,cx));return isErr(v)?v:v/100;}
    case 'bin':return binop(n.op,scalar(evalAst(n.a,sh,cx)),scalar(evalAst(n.b,sh,cx)));
    case 'fn':{const f=FN[n.name];if(!f)return E.NAME;return f.f(n.args,sh,cx);}
  }
  return E.VALUE;
}
const ev1=(n,sh,cx)=>scalar(evalAst(n,sh,cx));
function rangeVals(rg,sh,cx){const c1=Math.min(rg.a.c,rg.b.c),c2=Math.max(rg.a.c,rg.b.c),r1=Math.min(rg.a.r,rg.b.r),r2=Math.max(rg.a.r,rg.b.r);const o=[];for(let r=r1;r<=r2;r++)for(let c=c1;c<=c2;c++)o.push(cellValue(sh,c,r,cx));return o;}
function collect(args,sh,cx){const o=[];for(const a of args){if(a.k==='missing')continue;const v=evalAst(a,sh,cx);if(v&&v.range){for(const x of rangeVals(v,sh,cx))o.push({v:x,ref:true});}else o.push({v,ref:a.k==='ref'});}return o;}
function nums(args,sh,cx){const o=[];for(const {v,ref} of collect(args,sh,cx)){if(isErr(v))return v;if(typeof v==='number')o.push(v);else if(!ref&&v!=null){const x=num(v);if(isErr(x))return x;o.push(x);}}return o;}
const asRange=n=>n.k==='range'?n:n.k==='ref'?{a:n,b:n}:null;
function critFn(c){
  if(typeof c==='number')return v=>typeof v==='number'&&Math.abs(v-c)<1e-9;
  const s=str(c);const m=/^(<=|>=|<>|<|>|=)?(.*)$/.exec(s);const op=m[1]||'=';const rhs=m[2];
  const lit=parseLiteral(rhs);const r=(rhs.trim()!==''&&typeof lit.v==='number')?lit.v:rhs;
  return v=>{
    if(typeof r==='string'&&op==='='){if(r==='')return v==null||v==='';return typeof v==='string'&&v.toLowerCase()===r.toLowerCase();}
    if(v==null)return op==='<>';
    if(rank(v)!==rank(r))return op==='<>';
    return cmpRes(op,compare(v,r));
  };
}
const numArg=(a,i,sh,cx)=>num(ev1(a[i],sh,cx));
const FN={
  ABS:{cat:'Mathematik',a:['Zahl'],min:1,max:1,d:'Gibt den Betrag einer Zahl zurück (die Zahl ohne Vorzeichen).',f:(a,sh,cx)=>{const x=numArg(a,0,sh,cx);return isErr(x)?x:Math.abs(x);}},

const FNAMES=Object.keys(FN).sort((x,y)=>x.localeCompare(y,'de'));
const isDateF=f=>f==='date'||f==='datelong'||f==='datetime'||f==='time';
function inferFmt(n,sh){
  switch(n.k){
    case 'ref':{const c=sh.cells[A(n.c,n.r)];return c&&c.fmt&&c.fmt!=='text'?c.fmt:'general';}
    case 'fn':
      if(n.name==='HEUTE'||n.name==='DATUM')return 'date';if(n.name==='JETZT')return 'datetime';
      if(['SUMME','MIN','MAX','MITTELWERT'].includes(n.name)&&n.args[0]){const a=n.args[0];return inferFmt(a.k==='range'?{k:'ref',c:a.a.c,r:a.a.r}:a,sh);}
      return 'general';
    case 'bin':{if(!['+','-','*','/'].includes(n.op))return 'general';const fa=inferFmt(n.a,sh),fb=inferFmt(n.b,sh);
      if(n.op==='-'&&isDateF(fa)&&isDateF(fb))return 'general';
      if(n.op==='+'||n.op==='-'){if(isDateF(fa))return fa;if(n.op==='+'&&isDateF(fb))return fb;}
      if(fa==='currency'||fb==='currency')return 'currency';return 'general';}
    case 'neg':return inferFmt(n.a,sh);
  }
  return 'general';
}
function shiftFormula(f,dr,dc){
  return f.replace(/("[^"]*"?)|(?<![A-Za-z0-9_ÄÖÜäöüß])(\$?)([A-Za-z]{1,3})(\$?)(\d+)(?![A-Za-z0-9_(ÄÖÜäöüß])/g,(m,s,a1,col,a2,row)=>{
    if(s)return s;let c=colIndex(col),r=+row-1;if(!a1)c+=dc;if(!a2)r+=dr;if(c<0||r<0)return '#BEZUG!';return a1+colName(c)+a2+(r+1);});
}
function normalizeFormula(t){
  t=t.replace(/[„“”]/g,'"');let out='',inS=false;
  for(const ch of t){if(ch==='"'){inS=!inS;out+=ch;}else out+=inS?ch:ch.toUpperCase();}
  let d=0;inS=false;for(const ch of out){if(ch==='"'){inS=!inS;continue;}if(inS)continue;if(ch==='(')d++;if(ch===')')d--;}
  if(inS)out+='"';if(d>0)out+=')'.repeat(d);
  return out;
}
function mkCtx(sh){
  const cx={cache:new Map(),vis:new Set()};
  const X={sh,cx,
    cell:k=>sh.cells[k],
    val:k=>{const p=parseA(k);return cellValue(sh,p.c,p.r,cx);},
    evalF:f=>{try{return scalar(evalAst(parseFormula(f.slice(1)),sh,cx));}catch(e){return E.NAME;}},
    disp:k=>{const c=sh.cells[k];return fmtVal(X.val(k),c&&c.fmt);},
    isEmpty:k=>{const c=sh.cells[k];return !c||(c.f==null&&(c.v==null||c.v===''));}
  };
  return X;
}
function eq(a,b){
  if(a==null)a=0;if(b==null)b=0;
  if(typeof a==='number'&&typeof b==='number')return Math.abs(a-b)<1e-6;
  if(typeof a==='string'&&typeof b==='string')return a.trim().toLowerCase()===b.trim().toLowerCase();
  return a===b;
}

/* =====================================================================
   FEHLER-DIAGNOSE (kindgerechte Hinweise)
   ===================================================================== */
function lev(a,b){const d=[];for(let i=0;i<=a.length;i++){d[i]=[i];}for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length];}
function unknownIds(f){let T;try{T=tokenize(f.slice(1));}catch(e){return[];}const o=[];T.forEach((t,i)=>{if(t.t==='id'&&t.v!=='WAHR'&&t.v!=='FALSCH'){const isFn=T[i+1]&&T[i+1].t==='(';if(!isFn||!FN[t.v])o.push({v:t.v,fn:isFn});}});return o;}
function errDiag(f,v){
  if(v.e==='#NAME?'){
    const u=unknownIds(f);
    if(u.length){const x=u[0];
      if(x.fn){let best=null,bd=9;for(const n of FNAMES){const d=lev(x.v,n);if(d<bd){bd=d;best=n;}}
        return 'Excel kennt die Funktion <b>'+esc(x.v)+'</b> nicht (#NAME?).'+(bd<=3?' Meintest du <code>'+best+'</code>? Achte auf die Schreibweise.':'');}
      return 'Excel kennt das Wort <b>'+esc(x.v.toLowerCase())+'</b> nicht (#NAME?). <b>Wörter musst du in Anführungszeichen schreiben:</b> <code>"'+esc(x.v.toLowerCase())+'"</code>';}
    return 'Excel zeigt #NAME? – irgendetwas in der Formel kennt Excel nicht. Prüfe die Schreibweise.';}
  if(v.e==='#WERT!')return 'Excel zeigt #WERT! – du rechnest mit Text. Mit Wörtern kann Excel nicht rechnen. Prüfe, welche Zellen du angeklickt hast.';
  if(v.e==='#DIV/0!')return 'Excel zeigt #DIV/0! – du teilst durch 0 oder durch eine leere Zelle.';
  if(v.e==='#BEZUG!')return 'Excel zeigt #BEZUG! – ein Zellbezug ist ungültig.';
  return 'In der Zelle steht ein Fehler: '+v.e;
}
const fnUsed=(f,name)=>new RegExp('(^|[^A-ZÄÖÜ0-9])'+name+'\\(').test(String(f).toUpperCase().replace(/"[^"]*"/g,''));
const hasRef=f=>/(^|[^A-Z])\$?[A-Z]{1,3}\$?\d+/.test(String(f).toUpperCase().replace(/"[^"]*"/g,''));

const fail=(m,cell)=>({ok:false,msg:m,cell});
function checkFormula(t,X){
  const base=parseA(t.cells[0]);let note=null;
  for(let i=0;i<t.cells.length;i++){
    const k=t.cells[i],p=parseA(k),cell=X.cell(k),v=X.val(k);
    const expF=shiftFormula(t.expect,p.r-base.r,p.c-base.c);const ev=X.evalF(expF);
    if(X.isEmpty(k)){
      if(i>0&&!X.isEmpty(t.cells[0]))return fail('In '+t.cells[0]+' steht schon etwas – aber <b>'+k+'</b> ist noch leer. Ziehe die Formel mit dem Ausfüllkästchen ■ nach unten bis <b>'+t.cells[t.cells.length-1]+'</b>.',k);
      return fail('Die Zelle <b>'+k+'</b> ist noch leer.',k);}
    if(cell.f==null){
      if(eq(v,ev))return fail('In <b>'+k+'</b> steht das richtige Ergebnis – aber du hast es <b>eingetippt</b>. Lass Excel rechnen: Eine Formel beginnt immer mit <code>=</code>.',k);
      return fail('In <b>'+k+'</b> steht keine Formel. Eine Formel beginnt immer mit <code>=</code>.',k);}
    if(isErr(v)&&!isErr(ev))return fail('<b>'+k+':</b> '+errDiag(cell.f,v),k);
    const ok=t.accept?t.accept(v,ev,k,cell,X):eq(v,ev);
    if(!ok){const d=t.diagnose&&t.diagnose(k,cell,v,ev,X,i);return fail(d||('Das Ergebnis in <b>'+k+'</b> stimmt noch nicht. Deine Formel: <code>'+esc(cell.f)+'</code> – prüfe die angeklickten Zellen.'),k);}
    if(t.need&&!t.need.some(n=>fnUsed(cell.f,n)))return fail(t.needMsg||('Das Ergebnis stimmt – aber benutze dafür die Funktion <b>'+t.need[0]+'</b>.'),k);
    if(t.needRef&&!hasRef(cell.f))return fail('Richtiges Ergebnis – aber du hast mit festen Zahlen gerechnet. Klicke stattdessen die <b>Zellen</b> an. Dann rechnet Excel automatisch neu, wenn sich eine Zahl ändert.',k);
    if(t.fill&&i>0&&cell.src==='typed')note='Tipp: Statt jede Formel einzeln zu schreiben, kannst du sie mit dem Ausfüllkästchen ■ nach unten ziehen.';
  }
  return{ok:true,note};
}
function checkValues(t,X){
  const given=t.given||1;
  for(let i=0;i<t.cells.length;i++){
    const k=t.cells[i],exp=String(t.values[i]),d=X.disp(k).trim();
    if(d.toLowerCase()!==exp.toLowerCase()){
      const dg=t.diagnose&&t.diagnose(X,k,d,exp,i);if(dg)return fail(dg,k);
      if(d==='')return fail('<b>'+k+'</b> ist noch leer. Ziehe das Ausfüllkästchen ■ weiter – bis <b>'+t.cells[t.cells.length-1]+'</b>.',k);
      return fail('In <b>'+k+'</b> sollte „'+esc(exp)+'“ stehen, dort steht aber „'+esc(d)+'“.',k);}
  }
  const typed=t.cells.slice(given).some(k=>{const c=X.cell(k);return c&&c.src==='typed';});
  return{ok:true,note:typed?'Richtig! Aber mit dem Ausfüllkästchen ■ geht es viel schneller als abtippen – probier es beim nächsten Mal aus.':null};
}
function runCheck(t,sh){const X=mkCtx(sh);if(t.type==='formula')return checkFormula(t,X);if(t.type==='values')return checkValues(t,X);return t.check(X);}

 merk:`<h4>Eine Formel schreiben</h4><ul><li>Eine Formel beginnt <b>immer</b> mit <code>=</code></li><li>Klicke die Zellen an, statt Zahlen zu tippen (Zellbezug, z. B. <code>B3</code>). Dann rechnet Excel automatisch neu.</li><li><kbd>Enter ↵</kbd> schließt die Formel ab, <kbd>Esc</kbd> bricht ab.</li></ul>
 <h4>Rechenzeichen</h4><table><tr><td><code>+</code></td><td>plus (Summe)</td></tr><tr><td><code>-</code></td><td>minus (Differenz)</td></tr><tr><td><code>*</code></td><td>mal (Produkt)</td></tr><tr><td><code>/</code></td><td>geteilt (Quotient)</td></tr></table>
 <h4>SUMME und Zellbereich</h4><ul><li><code>=SUMME(B4:B7)</code> addiert alle Zahlen von B4 <b>bis</b> B7.</li><li>Der Doppelpunkt <code>:</code> bedeutet „bis“.</li><li>Tipp: Tippe <code>=SU</code> – Excel schlägt dir Funktionen vor. Mit <kbd>Tab ⇥</kbd> übernimmst du den Vorschlag.</li></ul>

 merk:`<h4>ANZAHL</h4><ul><li>Zählt, in wie vielen Zellen eine <b>Zahl</b> steht.</li><li>Die Zahlen werden <b>nicht</b> zusammengerechnet!</li><li>Beispiel: <code>=ANZAHL(B5:B32)</code> → Wie viele Personen haben einen Laptop?</li></ul>
 <h4>ANZAHL2</h4><ul><li>Zählt jede <b>beschriftete</b> Zelle – egal ob Text oder Zahl.</li><li>Beispiel: <code>=ANZAHL2(A5:A32)</code> → Wie viele Personen arbeiten in der Firma?</li></ul>
 <h4>ANZAHLLEEREZELLEN</h4><ul><li>Zählt die <b>leeren</b> Zellen.</li><li>Beispiel: <code>=ANZAHLLEEREZELLEN(C5:C32)</code> → Wer hat noch kein Smartphone?</li></ul>
 <h4>Achtung</h4><ul><li><b>SUMME</b> addiert die Zahlen (z. B. Anzahl der Geräte). <b>ANZAHL</b> zählt die Zellen (z. B. Anzahl der Personen).</li></ul>`},

   check:X=>{const t=todaySerial();if(X.isEmpty('B13'))return fail('B13 ist noch leer.','B13');const c13=X.cell('B13');if(X.val('B13')!==t)return fail('In B13 soll das heutige Datum stehen.','B13');if(!c13.f||!fnUsed(c13.f,'HEUTE'))return fail('B13 stimmt – aber nimm hier bitte die Funktion <code>=HEUTE()</code>.','B13');
     if(X.val('B14')!==21)return fail('In B14 soll die Zahl <b>21</b> stehen (die Ausleihdauer in Tagen).','B14');const c=X.cell('B15');if(X.isEmpty('B15'))return fail('B15 ist noch leer.','B15');if(!c.f)return fail('In B15 steht keine Formel. Rechne: <code>=B13+B14</code>','B15');
     const v=X.val('B15');if(isErr(v))return fail(errDiag(c.f,v),'B15');if(!eq(v,t+21))return fail('Das Rückgabedatum stimmt noch nicht. Rechne <b>heutiges Datum plus 21 Tage</b>.','B15');if(!isDateF(c.fmt))return fail('Das Ergebnis stimmt, wird aber als Zahl angezeigt. Formatiere B15 als <b>Datum, kurz</b> (Start → Zahl).','B15');
     if(!hasRef(c.f))return fail('Rechne mit den Zellen B13 und B14, nicht mit festen Zahlen: <code>=B13+B14</code>','B15');return{ok:true};}},

 merk:`<h4>Heutiges Datum</h4><ul><li><code>=HEUTE()</code> zeigt immer das aktuelle Datum (Live-Funktion). Gut für Vorlagen.</li><li>Shortcut <kbd>Strg</kbd> + <kbd>.</kbd> schreibt das heutige Datum als <b>festen</b> Wert.</li></ul>
 <h4>Datum eingeben</h4><ul><li>Format <b>TT.MM.JJJJ</b>, z. B. <code>03.04.2023</code></li><li>Datumsformat einstellen: Register Start → Gruppe Zahl → <b>Datum, kurz</b></li></ul>
 <h4>Mit Datum rechnen</h4><ul><li><b>Differenz:</b> Datum minus Datum = Anzahl Tage → <code>=B3-B4</code></li><li><b>Summe:</b> Datum plus Tage = neues Datum → <code>=B13+B14</code></li><li><b>Rückwärts:</b> <code>=HEUTE()-2</code> → vor 2 Tagen</li></ul>`},

 merk:`<h4>Aufbau</h4><p>WENN die Ampel grün ist, DANN gehe ich, SONST bleibe ich stehen.</p><p><code>=WENN(Wahrheitstest;[Wert_wenn_wahr];[Wert_wenn_falsch])</code></p><p>Beispiel: <code>=WENN(A6="rot";"stehen";"gehen")</code></p>
 <ul><li>Die drei Teile werden mit <b>Semikolon ;</b> getrennt.</li><li><b>Wörter immer in „Anführungszeichen“</b> – sonst versteht Excel nicht, dass es ein Wort ist.</li></ul>
 <h4>Vergleichsoperatoren</h4><table><tr><td><code>=</code></td><td>gleich</td></tr><tr><td><code>&gt;</code></td><td>größer als</td></tr><tr><td><code>&lt;</code></td><td>kleiner als</td></tr><tr><td><code>&gt;=</code></td><td>größer oder gleich</td></tr><tr><td><code>&lt;=</code></td><td>kleiner oder gleich</td></tr><tr><td><code>&lt;&gt;</code></td><td>ungleich</td></tr></table>
 <h4>Rechnung statt Wort</h4><ul><li><code>=WENN(B4&gt;35;B4*$G$4;0)</code></li><li><code>$G$4</code>: Die Dollarzeichen halten die Zelle beim Ausfüllen fest.</li></ul>`}
];

function gradeF(X,k,exp,{need=null,max=2,constPts=1,refOk=false}={}){
  const cell=X.cell(k),v=X.val(k),ev=X.evalF(exp);
  if(X.isEmpty(k))return{p:0,msg:'Nicht bearbeitet. Lösung: <code>'+esc(exp)+'</code>'};
  if(cell.f==null)return{p:0,msg:eq(v,ev)?'Ergebnis eingetippt statt mit einer Formel berechnet. Lösung: <code>'+esc(exp)+'</code>':'Keine Formel. Lösung: <code>'+esc(exp)+'</code>'};
  if(isErr(v))return{p:0,msg:errDiag(cell.f,v)+' Lösung: <code>'+esc(exp)+'</code>'};
  if(!eq(v,ev))return{p:0,msg:'Falsches Ergebnis mit <code>'+esc(cell.f)+'</code>. Richtig wäre z. B. <code>'+esc(exp)+'</code>'};
  if(need&&!need.some(n=>fnUsed(cell.f,n)))return{p:max-1,msg:'Ergebnis richtig, aber ohne die Funktion '+need[0]+' gerechnet: <code>'+esc(cell.f)+'</code>'};
  if(!refOk&&!hasRef(cell.f))return{p:constPts,msg:'Ergebnis richtig, aber mit festen Zahlen statt Zellbezügen: <code>'+esc(cell.f)+'</code>'};
  return{p:max,msg:'Richtig: <code>'+esc(cell.f)+'</code>'};
}

function gradeFill(X,cells,exp,{need,maxFirst,maxRest,accept,extra}){
  const base=parseA(cells[0]);let ok=0;const cellOk=k=>{const p=parseA(k),c=X.cell(k);if(!c||!c.f||(need.length&&!need.some(n=>fnUsed(c.f,n))))return false;const ev=X.evalF(shiftFormula(exp,p.r-base.r,p.c-base.c));const v=X.val(k);return accept?accept(v,ev):eq(v,ev);};
  const first=gradeF(X,cells[0],exp,{need:need.length?need:null,max:maxFirst,constPts:0});
  if(first.p===maxFirst&&accept&&!cellOk(cells[0]))first.p=0;
  for(const k of cells.slice(1))if(cellOk(k))ok++;
  const n=cells.length-1;let rest=ok===n?maxRest:ok>=Math.ceil(n*0.8)?Math.floor(maxRest/2):0;
  let msg=first.msg.replace(/^Richtig:/,'Formel in '+cells[0]+' richtig:')+(ok===n?' · Alle Zeilen richtig ausgefüllt.':ok>0?' · '+ok+' von '+n+' weiteren Zeilen richtig.':' · Die weiteren Zeilen fehlen oder sind falsch.');
  let p=first.p+rest;if(extra){const x=extra(X);if(x){p=Math.max(0,p-1);msg+=' '+x;}}
  return{p,msg};
}

  drop.addEventListener('drop',e=>readFiles([...e.dataTransfer.files]));
  $('#fi').onchange=e=>readFiles([...e.target.files]);
  $('#paste').onclick=()=>{modal('Abgabe-Code einfügen','<p>Füge hier einen oder mehrere Abgabe-Codes ein (jeweils der komplette Text, beginnt mit <code>{</code>).</p><textarea id="pcv" style="width:100%;height:180px"></textarea>',[{t:'Abbrechen'},{t:'Übernehmen',p:1,f:()=>{const t=document.getElementById('pcv').value;const parts=t.split(/(?<=\})\s*(?=\{"app")/);let n=0,er=0;for(const x of parts){try{if(!addSub(JSON.parse(x.trim()),'Code'))n++;else er++;}catch(e){if(x.trim())er++;}}saveSubs();render();toast(n+' Abgabe(n) übernommen'+(er?', '+er+' fehlerhaft':''));}}]);};
  document.querySelectorAll('tr[data-i]').forEach(tr=>tr.onclick=()=>detail(groups[+tr.dataset.g].R[+tr.dataset.i]));
  document.querySelectorAll('[data-csv]').forEach(b=>b.onclick=()=>saveCSV(groups[+b.dataset.csv]));
  document.querySelectorAll('[data-cpy]').forEach(b=>b.onclick=async()=>{const t=tableText(groups[+b.dataset.cpy],'\t');try{await navigator.clipboard.writeText(t);toast('📋 Tabelle kopiert – in Excel einfügen');}catch(e){modal('Tabelle','<textarea style="width:100%;height:220px">'+esc(t)+'</textarea>',[{t:'OK',p:1}]);}});
  document.querySelectorAll('[data-clr]').forEach(b=>b.onclick=()=>{const g=groups[+b.dataset.clr];modal('Liste leeren?','Alle geladenen Abgaben von „'+esc(g.P.title)+'“ werden aus dem Lehrertool entfernt. Die Dateien selbst bleiben erhalten.',[{t:'Abbrechen'},{t:'Leeren',p:1,f:()=>{SUBS=SUBS.filter(x=>x.o.app!==g.P.app);saveSubs();render();}}]);});
}
function tableText(G,sep){const R=G.R,P=G.P;
  const head=['Klasse','Nachname','Vorname','Abgegeben','Punkte','Max','Prozent','Note',...P.items.map((it,i)=>'A'+(i+1)+' ('+it.max+')'),'Hinweis'];
  const q=v=>sep===';'&&/[;"\n]/.test(String(v))?'"'+String(v).replace(/"/g,'""')+'"':v;
  return [head.join(sep),...R.map(r=>{const o=r.s.o;return [o.student.klasse,o.student.nach,o.student.vor,new Date(o.submitted).toLocaleString('de-DE'),String(r.g.pts).replace('.',','),P.max,r.g.pct.toFixed(1).replace('.',','),noteOf(r.g.pct),...r.g.items.map(x=>x.p),r.g.ok?'':'Datei verändert'].map(q).join(sep);})].join('\n');
}
async function saveCSV(G){
  const data='﻿'+tableText(G,';');const fn=(G.P.app==='excel-kurzprobe-9'?'Excel-Kurzprobe':'Excel-Uebungsprobe')+'_Ergebnisse.csv';
  if(DL){try{await DL.save({filename:fn,data});toast('💾 Gespeichert');return;}catch(e){if(e&&e.code==='declined')return;}}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/csv'}));a.download=fn;document.body.appendChild(a);a.click();a.remove();}catch(e){toast('Speichern nicht möglich – nutze „Tabelle kopieren“');}
}
function detail(r){
  const o=r.s.o,nt=noteOf(r.g.pct),P=r.g.P;
  const topics={};r.g.items.forEach(i=>{topics[i.topic]=topics[i.topic]||{p:0,m:0};topics[i.topic].p+=i.p;topics[i.topic].m+=i.max;});
  modal(`${esc(o.student.vor)} ${esc(o.student.nach)}${o.student.klasse?' ('+esc(o.student.klasse)+')':''}: ${r.g.pts}/${P.max} P. · ${r.g.pct.toFixed(1).replace('.',',')} % · Note ${nt}`,
   `${r.g.ok?'':'<div class="fbw">⚠ Die Prüfsumme passt nicht: Die Datei wurde nach dem Abgeben verändert. Bitte prüfen!</div>'}
    <div class="tps">${Object.entries(topics).map(([k,v])=>`<span>${P.topics[k]}: <b>${v.p}/${v.m}</b></span>`).join('')}</div>
    <table class="det"><tr><th>Nr.</th><th>Aufgabe</th><th>Eingabe</th><th>P.</th><th>Kommentar</th></tr>${r.g.items.map(i=>`<tr><td>${i.nr}</td><td>${i.text}</td><td><code>${esc(i.ans||'–')}</code></td><td class="pp" style="color:${i.p===i.max?'#1d7044':i.p>0?'#b07d00':'#c0392b'}">${i.p}/${i.max}</td><td>${i.msg}</td></tr>`).join('')}</table>
    <p class="mu">Abgegeben am ${new Date(o.submitted).toLocaleString('de-DE')} · ${(o.checks||[]).length} von ${P.items.length} Aufgaben als erledigt abgehakt.</p>`,[{t:'Schließen',p:1}],'wide');
}
function keyUI(){
  const labels=['1','2','3','4','5'];
  $('#key').innerHTML=`<b>Notenschlüssel</b> (nur Prozente): ${labels.map((l,i)=>`<label>Note ${l} ab <input type="number" min="0" max="100" step="0.5" value="${KEY[i]}" data-k="${i}"> %</label>`).join('')}<span>Note 6 darunter</span> <a class="lk" id="kr">Standard</a>`;
  $('#key').querySelectorAll('input').forEach(inp=>inp.onchange=()=>{KEY[+inp.dataset.k]=parseFloat(inp.value)||0;store.set('tkey',KEY);render();});
  $('#kr').onclick=()=>{KEY=[...KEY_DEF];store.set('tkey',KEY);keyUI();render();};
}
function modal(title,html,btns,cls){const old=document.getElementById('mask');if(old)old.remove();const m=document.createElement('div');m.className='mask';m.id='mask';
  m.innerHTML=`<div class="dlg ${cls||''}"><div class="dh">${title}</div><div class="dc">${html}</div><div class="df">${btns.map((b,i)=>`<button class="${b.p?'pri':''}" data-b="${i}">${b.t}</button>`).join('')}</div></div>`;
  document.body.appendChild(m);m.querySelectorAll('[data-b]').forEach(el=>el.onclick=()=>{const b=btns[+el.dataset.b];b.f&&b.f();m.remove();});}
let tt;function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(tt);tt=setTimeout(()=>e.style.display='none',2000);}
document.addEventListener('dragover',e=>e.preventDefault());document.addEventListener('drop',e=>{if(!e.target.closest('#drop')){e.preventDefault();if(e.dataTransfer.files.length)readFiles([...e.dataTransfer.files]);}});
keyUI();render();
</script></body></html>
